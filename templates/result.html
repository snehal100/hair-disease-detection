<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Hair Disease Detection</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins&display=swap" rel="stylesheet">
</head>

<body>
    <header>
        <div class="wrapper">
            <ul class="nav-area">
                <li><a href="http://127.0.0.1:8000/">Home</a></li>
                <li><a href="#">About</a></li>
            </ul>
        </div>

        <div class="main_section">
            {% if pred_flag %}
            <h1>Hair has <span class="disease">'{{ predictedLabel }}'</span>! </h1>
            {% else %}
            <h1>Hair has <span class="disease">'{{ predictedLabel }}!'</span> </h1>
            {% endif %}
            
            <!-- Disease image display -->
            <img src="{{ filePathName }}" alt='' style="width:300px;height:300px;border: 5px solid white; margin-top: 20px;"> 
            
            <!-- New button for showing disease information -->
            <button class="info-button" onclick="showDiseaseInfo('{{ predictedLabel }}')">Show Disease Info</button>
        </div>
        
    </header>

    <!-- JavaScript to redirect based on disease -->
    <script>
        function showDiseaseInfo(predictedLabel) {
            if (predictedLabel === 'Alopecia Areata') {
                window.location.href = '/alopecia/';  // Corrected path to the Django URL
            } else if (predictedLabel === 'Folliculitis') {
                window.location.href = '/folliculitis/';  // Corrected path to the Django URL
            } else if (predictedLabel === 'Psoriasis') {
                window.location.href = '/psoriasis/';  // Corrected path to the Django URL
            } else {
                alert('No detailed information available for this disease.');
            }
        }
    </script>
</body>

<style>
/* Existing styles */
*
{
    margin: 0;
    padding: 0;
}
body 
{
    font-family: 'Poppins', sans-serif;
}
.wrapper 
{
    width: 100%;
    margin: auto;
}
.disease{
    color: red;
}
header 
{
    background: linear-gradient(rgba(0, 0, 0, 0.6), rgba(0, 0, 0, 0.6)), url(https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcS8IEfSNKsFXuVMDZZLIvSLhEcpYpgAlLMfOIVilxdX7A&s);
    height: 100vh;
    -webkit-background-size: cover;
    background-size: cover;
    background-position: center center;
    position: relative;
}
.nav-area 
{
    float: right;
    list-style: none;
    margin-top: 30px;
}
.nav-area li 
{
    display: inline-block;
}
.nav-area li a 
{
    color: #fff;
    text-decoration: none;
    padding: 5px 20px;
    font-family: poppins;
    font-size: 16px;
}
.nav-area li a:hover 
{
    color: #ffe15d;
}
.main_section 
{
    position: absolute;
    margin: 10% 30%;
    text-align: center;
}
.main_section h1 
{
    color: white;
    font-size: 60px;
    text-shadow: 3px 3px black;
}
.main_section a 
{
    color: white;
}

/* New button styling */
.info-button {
    padding: 10px 20px;
    font-size: 18px;
    background-color: #4682B4;
    color: white;
    border: none;
    border-radius: 5px;
    margin-top: 20px;
    cursor: pointer;
}

.info-button:hover {
    background-color: #5ba4d4;
}

/* Media query for small screens */
@media (max-width:600px) 
{
    .wrapper 
    {
        width: 100%;
        height: 100vh;
    }
    img 
    {
        width: 100%;
        height: 100vh;
    }
    .nav-area 
    {
        float: none;
        margin-top: 0;
    }
    .nav-area li a 
    {
        padding: 5px;
        font-size: 11px;
    }
    .nav-area 
    {
        text-align: center;
    }
}
</style>

</html>
