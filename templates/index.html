{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Hair Disease Detection</title>
    <link rel="stylesheet" href="{% static 'css/index.css' %}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins&display=swap" rel="stylesheet">
</head>

<body>
    <header>
        <div class="wrapper">
            <ul class="nav-area">
                <li><a href="{% url 'homepage' %}">Home</a></li>
                <li><a href="{% url 'about' %}">About</a></li>
                <!-- <li><a href="{% url 'register' %}">Register</a></li>
                <li><a href="{% url 'login' %}">Login</a></li> -->
            </ul>
        </div>

        <div class="welcome-text">
            <h1>Hair <span class="disease">'Disease'</span> Detection</h1>
            <form method="post" enctype="multipart/form-data" action="{% url 'predictImage' %}">
                {% csrf_token %}
                <input name="filePath" type="file" id="files" class="hidden"/>
                <label for="files">Select file</label>
                <br>
                <label for="file-input">
                    <i class="fas fa-upload"></i> &nbsp;
                    <input type="submit" class="fas fa-upload" value="SUBMIT">
                </label>
            </form>
        </div>
    </header>

    <section class="auth-section">
        <div class="auth-box">
            <h2>Quick Access</h2>
            <div class="auth-links">
                <a href="{% url 'register' %}" class="auth-btn">Register</a>
                <a href="{% url 'login' %}" class="auth-btn">Login</a>
            </div>
        </div>
    </section>
</body>

<style>
/* Existing styles above */

.auth-section {
    text-align: center;
    margin-top: 30px;
}
.auth-box {
    background: rgba(255, 255, 255, 0.1);
    padding: 20px;
    border-radius: 10px;
    display: inline-block;
}
.auth-links {
    margin-top: 10px;
}
.auth-btn {
    display: inline-block;
    padding: 10px 20px;
    margin: 5px;
    border: 1px solid #fff;
    color: #fff;
    text-decoration: none;
    font-size: 16px;
    border-radius: 5px;
    transition: 0.3s ease;
}
.auth-btn:hover {
    background: #fff;
    color: #333;
    cursor: pointer;
}
</style>

</html>
